name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: go test ./...
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp README.md stage/
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="luochu-$os-$arch"
            if [ "$os" = windows ]; then
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o stage/luochu.exe ./cmd/luochu
              zip -j "dist/$name.zip" stage/luochu.exe stage/README.md
              rm stage/luochu.exe
            else
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o stage/luochu ./cmd/luochu
              tar -C stage -czf "dist/$name.tar.gz" luochu README.md
              rm stage/luochu
            fi
          done
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: luochu-linux-amd64.tar.gz
            binary: luochu
          - os: windows-latest
            archive: luochu-windows-amd64.zip
            binary: luochu.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Extract Linux archive and verify checksums
        if: runner.os == 'Linux'
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          mkdir extracted
          tar -xzf "${{ matrix.archive }}" -C extracted
      - name: Extract Windows archive
        if: runner.os == 'Windows'
        run: Expand-Archive -Path "dist/${{ matrix.archive }}" -DestinationPath "dist/extracted"
      - run: node tests/release-smoke.mjs "dist/extracted/${{ matrix.binary }}"
      - name: Test Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/mock-bin"
          cat > "$RUNNER_TEMP/mock-bin/curl" <<'EOF'
          #!/bin/sh
          cp "$GITHUB_WORKSPACE/dist/${2##*/}" "$4"
          EOF
          chmod +x "$RUNNER_TEMP/mock-bin/curl"
          export PATH="$RUNNER_TEMP/mock-bin:$PATH"
          export LUOCHU_INSTALL_DIR="$RUNNER_TEMP/luochu-install"
          sh ./install.sh v0.1.0-alpha.1
          node tests/release-smoke.mjs "$LUOCHU_INSTALL_DIR/luochu"
          printf '%064d  ./luochu-linux-amd64.tar.gz\n' 0 > dist/SHA256SUMS
          export LUOCHU_INSTALL_DIR="$RUNNER_TEMP/bad-install"
          if sh ./install.sh v0.1.0-alpha.1; then
            echo "Installer accepted an invalid checksum" >&2
            exit 1
          fi
          test ! -e "$LUOCHU_INSTALL_DIR/luochu"
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Invoke-WebRequest {
            param([switch]$UseBasicParsing, [string]$Uri, [string]$OutFile)
            $name = [System.IO.Path]::GetFileName(([uri]$Uri).AbsolutePath)
            Copy-Item (Join-Path "$env:GITHUB_WORKSPACE/dist" $name) $OutFile
          }
          ./install.ps1 -Version v0.1.0-alpha.1 -InstallDir "$env:RUNNER_TEMP/luochu-install"
          node tests/release-smoke.mjs "$env:RUNNER_TEMP/luochu-install/luochu.exe"
          ("0" * 64 + "  ./luochu-windows-amd64.zip") | Set-Content dist/SHA256SUMS
          $rejected = $false
          try {
            ./install.ps1 -Version v0.1.0-alpha.1 -InstallDir "$env:RUNNER_TEMP/bad-install"
          } catch {
            $rejected = $true
          }
          if (-not $rejected -or (Test-Path "$env:RUNNER_TEMP/bad-install/luochu.exe")) {
            throw "Installer accepted an invalid checksum"
          }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"

  install:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install published Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LUOCHU_INSTALL_DIR="$RUNNER_TEMP/luochu-install"
          curl -fsSL https://raw.githubusercontent.com/yihui/luochu/main/install.sh | sh -s -- "$GITHUB_REF_NAME"
          node tests/release-smoke.mjs "$LUOCHU_INSTALL_DIR/luochu"
      - name: Install published Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://raw.githubusercontent.com/yihui/luochu/main/install.ps1))) -Version "$env:GITHUB_REF_NAME" -InstallDir "$env:RUNNER_TEMP/luochu-install"
          node tests/release-smoke.mjs "$env:RUNNER_TEMP/luochu-install/luochu.exe"
