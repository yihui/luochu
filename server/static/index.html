<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luochu</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header>
    <strong>Luochu</strong>
    <button id="mode-toggle" type="button">Visual</button>
    <button id="save-file" type="button" disabled>Save</button>
    <span id="terminal-controls" hidden>
      <button id="terminal-toggle" type="button">Open terminal</button>
      <button id="terminal-paste" type="button" disabled>Paste selection</button>
    </span>
  </header>
  <main>
    <aside id="sidebar" class="sidebar panel">
      <nav id="sidebar-tabs" class="tabset" aria-label="Sidebar"></nav>
      <div id="file-tree" class="file-tree" aria-label="Project files"></div>
      <section id="git-pane" class="git-pane panel" aria-label="Git" hidden></section>
    </aside>
    <nav id="file-tabs" class="tabset editor-tabs" aria-label="Open files"></nav>
    <section id="editor" class="editor-surface source-editor" aria-label="Source editor"></section>
    <iframe id="preview-pane" class="editor-surface preview-pane" title="Djot preview" sandbox="allow-same-origin"
      srcdoc="<!doctype html><html><head><link rel='stylesheet' href='assets/preview.css'></head><body><article id='preview'></article></body></html>"></iframe>
    <section id="git-diff" class="content-panel panel" aria-label="Git diff" hidden>
      <div id="git-diff-content"></div>
    </section>
    <section id="git-history" class="content-panel panel" aria-label="Git history" hidden>
      <div class="git-history-content">
        <div id="git-history-list" aria-label="Commits"></div>
        <pre id="git-history-diff"></pre>
      </div>
    </section>
    <div id="file-status" class="file-status" role="status" aria-live="polite"></div>
    <section id="terminal-pane" class="terminal-pane panel" aria-label="Terminal" hidden>
      <div class="terminal-bar">
        <nav id="terminal-tabs" class="tabset" aria-label="Terminals"></nav>
        <button id="terminal-add" class="tab-action" type="button" aria-label="New terminal" title="New terminal" disabled>+</button>
      </div>
      <div id="terminal-status" class="terminal-status" role="status"></div>
      <div id="terminal" class="terminal-output"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
